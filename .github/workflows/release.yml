name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Serialize releases: a newer tag must not publish while an older tag is still being checked.
concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check release tag and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must have the form vX.Y.Z." >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi
          published_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')"
          while IFS= read -r published_tag; do
            [[ "$published_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            if [[ "$published_tag" == "$GITHUB_REF_NAME" ]] ||
              [[ "$(printf '%s\n%s\n' "$published_tag" "$GITHUB_REF_NAME" | sort -V | tail -n1)" != "$GITHUB_REF_NAME" ]]; then
              echo "Release tag must be newer than the published release $published_tag." >&2
              exit 1
            fi
          done <<< "$published_tags"

      - run: npm ci

      # Only Chromium: Firefox gets no WebGL on the GPU-less runner, so its save tests run locally only.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # A release ships only what passed the whole gate.
      - run: ./localPipeline.sh --no-docker

      - name: Package static build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../helgas-katzenspiel-${VERSION}-web.zip" .)
          sha256sum "helgas-katzenspiel-${VERSION}-web.zip" > "helgas-katzenspiel-${VERSION}-web.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" helgas-katzenspiel-*-web.zip* \
            --title "Helgas Katzenspiel ${GITHUB_REF_NAME}" \
            --notes-file docs/release-notes.md

  image:
    name: Publish Docker image
    # Only after the release itself succeeded, so a failed release leaves no image behind.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/helgas-katzenspiel
    steps:
      - uses: actions/checkout@v7

      # The same check as the local pipeline: the image must serve the page and its bundle.
      - name: Build and smoke-test the image
        run: scripts/docker-check.sh helgas-katzenspiel:ci

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker tag helgas-katzenspiel:ci "$IMAGE:${GITHUB_REF_NAME#v}"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          # Re-running an old image job must not move :latest back to an old version.
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" == "$GITHUB_REF_NAME" ]]; then
            docker tag helgas-katzenspiel:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
