name: Docker

# Only builds and checks the image. Publishing to ghcr happens in release.yml, after a successful release,
# so the registry holds nothing but official releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and check image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The same check as the local pipeline: the image must serve the page and its bundle.
      - name: Build and smoke-test the image
        run: scripts/docker-check.sh helgas-katzenspiel:ci
