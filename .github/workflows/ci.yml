name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Local pipeline (lint, test, build, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium and Firefox for Playwright
        run: npx playwright install --with-deps chromium firefox

      # Exactly what runs locally before every commit.
      # The Docker image is built and checked by docker.yml; building it here too would be a duplicate.
      - run: ./localPipeline.sh --no-docker

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
